<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🔨 Whack-a-Mole — Ellie &amp; Grandpa</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            min-height:100vh; min-height:100dvh;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Rounded,sans-serif;
            background:linear-gradient(135deg,#1a0040,#0a1560,#2d0060,#0a1560,#1a0040);
            background-size:400% 400%;
            animation:bgShift 12s ease infinite;
            display:flex; flex-direction:column; align-items:center;
            padding:14px 14px 24px; overflow-x:hidden; color:white;
        }
        @keyframes bgShift {
            0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
        }

        .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .star {
            position:absolute; background:white; border-radius:50%;
            animation:twinkle var(--d) ease-in-out infinite var(--delay); opacity:0;
        }
        @keyframes twinkle {
            0%,100%{opacity:0;transform:scale(0.4)} 50%{opacity:0.9;transform:scale(1)}
        }

        .game {
            position:relative; z-index:1; width:100%; max-width:420px;
            display:flex; flex-direction:column; align-items:center; gap:12px;
        }

        .top-bar { width:100%; display:flex; align-items:center; gap:10px; }
        .back-btn {
            background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.2);
            color:white; border-radius:50px; padding:8px 14px; font-size:0.82rem;
            font-weight:700; white-space:nowrap; flex-shrink:0;
            text-decoration:none; transition:background 0.2s; letter-spacing:0.5px;
        }
        .back-btn:active { background:rgba(255,255,255,0.22); }
        h1 {
            flex:1; text-align:center; font-size:1.35rem; font-weight:900;
            text-shadow:0 0 20px rgba(255,200,80,0.8); letter-spacing:1px;
        }
        .top-spacer { flex-shrink:0; width:74px; }

        .stats-row { display:flex; gap:10px; width:100%; }
        .stat-card {
            flex:1; background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
            border:2px solid rgba(255,255,255,0.15); border-radius:20px;
            padding:10px 8px; text-align:center;
        }
        .stat-icon  { font-size:1.2rem; }
        .stat-value { font-size:1.9rem; font-weight:900; color:#ffd700;
                      text-shadow:0 0 10px rgba(255,215,0,0.55); line-height:1.1; }
        .stat-label { font-size:0.62rem; color:rgba(255,255,255,0.4);
                      letter-spacing:2px; text-transform:uppercase; }
        @keyframes bump {
            0%{transform:scale(1)} 45%{transform:scale(1.3)} 100%{transform:scale(1)}
        }
        .bump { animation:bump 0.35s cubic-bezier(0.34,1.7,0.64,1); }

        .timer-card .stat-value { color:white; }
        .timer-card.urgent .stat-value { color:#ef4444; animation:pulse 0.5s ease infinite alternate; }
        @keyframes pulse { from{opacity:1} to{opacity:0.4} }

        .mole-grid {
            display:grid; grid-template-columns:repeat(3,1fr);
            gap:10px; width:100%; padding:4px;
        }

        .hole {
            position:relative; overflow:hidden;
            background:radial-gradient(ellipse at 50% 80%, #1a0a00 0%, #0d0520 70%);
            border-radius:50% / 45%;
            border:2.5px solid rgba(80,40,10,0.5);
            box-shadow:inset 0 6px 20px rgba(0,0,0,0.85), 0 3px 10px rgba(0,0,0,0.5);
            aspect-ratio:1;
            cursor:pointer;
            touch-action:manipulation;
            user-select:none; -webkit-user-select:none;
        }

        .mole-wrap {
            position:absolute; bottom:0; left:50%;
            transform:translate(-50%, 100%);
            transition:transform 0.12s cubic-bezier(0.34,1.2,0.64,1);
            width:88%; pointer-events:none;
        }
        .hole.up .mole-wrap {
            transform:translate(-50%, 12%);
        }
        .mole-wrap img {
            width:100%; display:block;
            border-radius:48% 48% 0 0;
        }

        .hole.whacked .mole-wrap {
            transform:translate(-50%, 12%) scale(0.88);
            transition:transform 0.07s ease;
        }
        .hole.whacked::after {
            content:'💥';
            position:absolute; top:15%; left:50%;
            transform:translate(-50%,-50%);
            font-size:2rem; pointer-events:none;
            animation:splat 0.35s ease forwards;
        }
        @keyframes splat {
            0%  { transform:translate(-50%,-50%) scale(0.5); opacity:1; }
            60% { transform:translate(-50%,-80%) scale(1.4); opacity:1; }
            100%{ transform:translate(-50%,-110%) scale(1.0); opacity:0; }
        }

        .score-pop {
            position:absolute; top:10%; left:50%;
            transform:translate(-50%,-50%);
            color:#ffd700; font-size:1.1rem; font-weight:900;
            pointer-events:none; white-space:nowrap;
            animation:scoreFloat 0.7s ease forwards;
            text-shadow:0 2px 6px rgba(0,0,0,0.8);
        }
        @keyframes scoreFloat {
            0%  { opacity:1; transform:translate(-50%,-50%) scale(1); }
            100%{ opacity:0; transform:translate(-50%,-180%) scale(0.7); }
        }

        .status-bar {
            width:100%; background:rgba(255,255,255,0.1);
            border:1.5px solid rgba(255,255,255,0.2); border-radius:50px;
            padding:10px 20px; font-size:0.92rem; font-weight:700; text-align:center;
            min-height:44px; display:flex; align-items:center; justify-content:center;
        }

        .start-btn {
            background:linear-gradient(135deg,#ffd700,#ff8800); color:#1a0033;
            border:none; border-radius:50px; padding:14px 40px;
            font-size:1.1rem; font-weight:900; cursor:pointer;
            box-shadow:0 6px 24px rgba(255,140,0,0.5); letter-spacing:1px;
            transition:transform 0.15s; touch-action:manipulation;
        }
        .start-btn:active { transform:scale(0.93); }

        .overlay {
            position:fixed; inset:0; background:rgba(5,0,20,0.80);
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
            display:flex; align-items:center; justify-content:center;
            z-index:100; opacity:0; pointer-events:none; transition:opacity 0.4s ease;
        }
        .overlay.show { opacity:1; pointer-events:all; }
        .result-card {
            background:linear-gradient(145deg,rgba(50,0,90,0.97),rgba(10,15,80,0.97));
            border:2.5px solid rgba(255,215,0,0.55); border-radius:30px;
            padding:36px 28px 30px; text-align:center; max-width:320px; width:88%;
            box-shadow:0 0 60px rgba(255,215,0,0.2),0 24px 60px rgba(0,0,0,0.6);
            animation:cardIn 0.5s cubic-bezier(0.34,1.5,0.64,1);
        }
        @keyframes cardIn {
            from{transform:scale(0.55) translateY(50px);opacity:0}
            to  {transform:scale(1)   translateY(0);   opacity:1}
        }
        .r-emoji  { font-size:4.5rem; display:block; margin-bottom:8px; }
        .r-title  { font-size:1.8rem; font-weight:900; color:#ffd700;
                    text-shadow:0 0 20px rgba(255,215,0,0.7); margin-bottom:6px; }
        .r-score  { font-size:1rem; color:rgba(255,255,255,0.75); margin-bottom:4px; }
        .r-best   { font-size:0.82rem; color:rgba(255,215,0,0.65); margin-bottom:22px; min-height:1.2em; }
        .play-again-btn {
            background:linear-gradient(135deg,#ffd700,#ff8800); color:#1a0033;
            border:none; border-radius:50px; padding:14px 36px;
            font-size:1.1rem; font-weight:900; cursor:pointer;
            box-shadow:0 6px 24px rgba(255,140,0,0.5);
            transition:transform 0.15s; touch-action:manipulation;
        }
        .play-again-btn:active { transform:scale(0.92); }

        .confetti-wrap { position:fixed; inset:0; pointer-events:none; z-index:99; overflow:hidden; }
        .cp { position:absolute; top:-14px; animation:fall var(--fd) ease-in var(--del) forwards; }
        @keyframes fall {
            0%  {transform:translateY(0)     rotate(0deg);  opacity:1}
            100%{transform:translateY(110vh) rotate(720deg);opacity:0}
        }
    </style>
</head>
<body>

<div class="stars"         id="stars"></div>
<div class="confetti-wrap" id="confetti"></div>

<div class="overlay" id="overlay">
    <div class="result-card">
        <span class="r-emoji" id="rEmoji">🏆</span>
        <div class="r-title" id="rTitle">Time's Up!</div>
        <div class="r-score" id="rScore">You whacked 0 moles</div>
        <div class="r-best"  id="rBest"></div>
        <button class="play-again-btn" onclick="startGame()">Play Again! 🔨</button>
    </div>
</div>

<div class="game">
    <div class="top-bar">
        <a class="back-btn" href="index.html">← Games</a>
        <h1>🔨 Whack-a-Mole!</h1>
        <div class="top-spacer"></div>
    </div>

    <div class="stats-row">
        <div class="stat-card" id="scoreCard">
            <div class="stat-icon">⭐</div>
            <div class="stat-value" id="scoreVal">0</div>
            <div class="stat-label">score</div>
        </div>
        <div class="stat-card timer-card" id="timerCard">
            <div class="stat-icon">⏱️</div>
            <div class="stat-value" id="timerVal">60</div>
            <div class="stat-label">seconds</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">💨</div>
            <div class="stat-value" id="missVal">0</div>
            <div class="stat-label">missed</div>
        </div>
    </div>

    <div class="mole-grid" id="moleGrid"></div>

    <div class="status-bar" id="statusBar">Tap a mole to whack it!</div>

    <button class="start-btn" id="startBtn" onclick="startGame()">🔨 Start Game!</button>
</div>

/* Stars */
const starsEl = document.getElementById('stars');
for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = (Math.random() * 2.5 + 0.8).toFixed(1);
    s.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(Math.random()*3+2).toFixed(1)+'s;--delay:-'+(Math.random()*5).toFixed(1)+'s';
    starsEl.appendChild(s);
}

/* Build 3x3 grid */
const grid = document.getElementById('moleGrid');
const HOLES = 9;
const holeEls = [];

for (let i = 0; i < HOLES; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    const wrap = document.createElement('div');
    wrap.className = 'mole-wrap';
    const img = document.createElement('img');
    img.src = MOLE_SRC;
    img.alt = 'mole';
    img.draggable = false;
    wrap.appendChild(img);
    hole.appendChild(wrap);
    hole.addEventListener('touchstart', e => { e.preventDefault(); whack(i); }, { passive:false });
    hole.addEventListener('mousedown',  () => whack(i));
    grid.appendChild(hole);
    holeEls.push(hole);
}

/* State */
let score    = 0;
let misses   = 0;
let timeLeft = 60;
let active   = false;
let timers   = Array(HOLES).fill(null);
let upFlags  = Array(HOLES).fill(false);
let spawnTimer = null;
let countdownInterval = null;
let bestScore = parseInt(localStorage.getItem('moleBest') || '0', 10);

/* Difficulty helpers */
function getVisibleMs() {
    if (timeLeft > 40) return 1500 + Math.random() * 500;
    if (timeLeft > 20) return 1100 + Math.random() * 400;
    return 800 + Math.random() * 300;
}
function getMaxUp() {
    if (timeLeft > 40) return 1;
    if (timeLeft > 20) return 2;
    return 3;
}
function getSpawnDelay() {
    if (timeLeft > 40) return 800  + Math.random() * 500;
    if (timeLeft > 20) return 500  + Math.random() * 400;
    return 300 + Math.random() * 300;
}

/* Spawn */
function spawnMole() {
    if (!active) return;
    const upCount = upFlags.filter(Boolean).length;
    if (upCount < getMaxUp()) {
        const avail = [];
        upFlags.forEach((u, i) => { if (!u) avail.push(i); });
        if (avail.length) {
            const idx = avail[Math.floor(Math.random() * avail.length)];
            raiseMole(idx);
        }
    }
    spawnTimer = setTimeout(spawnMole, getSpawnDelay());
}

function raiseMole(idx) {
    upFlags[idx] = true;
    holeEls[idx].classList.add('up');
    timers[idx] = setTimeout(() => {
        if (upFlags[idx]) {
            misses++;
            document.getElementById('missVal').textContent = misses;
        }
        lowerMole(idx);
    }, getVisibleMs());
}

function lowerMole(idx) {
    clearTimeout(timers[idx]);
    timers[idx] = null;
    upFlags[idx] = false;
    holeEls[idx].classList.remove('up', 'whacked');
}

/* Whack */
function whack(idx) {
    if (!active || !upFlags[idx]) return;
    clearTimeout(timers[idx]);
    upFlags[idx] = false;
    score += 10;
    document.getElementById('scoreVal').textContent = score;
    bump('scoreCard');
    holeEls[idx].classList.add('whacked');
    showScorePop(holeEls[idx]);
    setTimeout(() => lowerMole(idx), 320);
}

function bump(id) {
    const el = document.getElementById(id);
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
}

function showScorePop(holeEl) {
    const pop = document.createElement('div');
    pop.className = 'score-pop';
    pop.textContent = '+10';
    holeEl.appendChild(pop);
    setTimeout(() => pop.remove(), 700);
}

/* Countdown */
function startCountdown() {
    countdownInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timerVal').textContent = timeLeft;
        if (timeLeft <= 10) document.getElementById('timerCard').classList.add('urgent');
        if (timeLeft <= 0) { clearInterval(countdownInterval); endGame(); }
    }, 1000);
}

/* Start */
function startGame() {
    score    = 0;
    misses   = 0;
    timeLeft = 60;
    active   = true;
    document.getElementById('scoreVal').textContent = 0;
    document.getElementById('missVal').textContent  = 0;
    document.getElementById('timerVal').textContent = 60;
    document.getElementById('timerCard').classList.remove('urgent');
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('statusBar').textContent = 'Whack those moles! 🔨';
    document.getElementById('confetti').innerHTML = '';
    clearTimeout(spawnTimer);
    clearInterval(countdownInterval);
    timers.forEach((_, i) => lowerMole(i));
    spawnMole();
    startCountdown();
}

/* End */
function endGame() {
    active = false;
    clearTimeout(spawnTimer);
    timers.forEach((_, i) => lowerMole(i));
    const isNew = score > bestScore;
    if (isNew) { bestScore = score; localStorage.setItem('moleBest', bestScore); }
    let emoji, title;
    if      (score >= 200) { emoji = '🏆'; title = 'CHAMPION!'; }
    else if (score >= 120) { emoji = '⭐'; title = 'Amazing!'; }
    else if (score >= 70)  { emoji = '👍'; title = 'Great Job!'; }
    else                   { emoji = '🔨'; title = 'Keep Practicing!'; }
    document.getElementById('rEmoji').textContent = emoji;
    document.getElementById('rTitle').textContent = title;
    document.getElementById('rScore').textContent = 'You whacked ' + (score/10) + ' moles (' + score + ' pts)';
    document.getElementById('rBest').textContent  = isNew ? '🏆 New best score!' : (bestScore > 0 ? 'Best: ' + bestScore + ' pts' : '');
    document.getElementById('overlay').classList.add('show');
    document.getElementById('startBtn').style.display = '';
    document.getElementById('statusBar').textContent = 'Game over! Final score: ' + score;
    if (score >= 70) launchConfetti(score >= 120 ? 90 : 45);
}

/* Confetti */
function launchConfetti(n) {
    const wrap   = document.getElementById('confetti');
    const colors = ['#ffd700','#ff6bbd','#a855f7','#38bdf8','#34d399','#fb923c','#f43f5e'];
    for (let i = 0; i < n; i++) {
        const p  = document.createElement('div');
        p.className = 'cp';
        const w  = Math.random() * 10 + 6;
        const h  = Math.random() * 10 + 6;
        const br = Math.random() > 0.5 ? '50%' : '2px';
        p.style.cssText = 'left:'+Math.random()*100+'%;width:'+w+'px;height:'+h+'px;background:'+colors[i%colors.length]+';border-radius:'+br+';--fd:'+(Math.random()*2+1.5).toFixed(2)+'s;--del:'+(Math.random()*.6).toFixed(2)+'s';
        wrap.appendChild(p);
    }
}
</script>
